name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  JAVA_DISTRIBUTION: "graalvm-community"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Unit tests (no Docker, fast feedback, ~30 s)
  # Convention: files ending in *Test.java
  # ─────────────────────────────────────────────────────────────────────────────
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up GraalVM JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run unit tests (*Test, no Testcontainers)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew test \
            --tests "*..*Test" \
            --continue \
            --no-daemon \
            -x checkstyleMain -x checkstyleTest

      - name: Publish unit test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "**/build/test-results/test/TEST-*.xml"
          check_name: "Unit Test Results"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Integration tests (Docker required, slower, ~3-5 min)
  # Convention: files ending in *IT.java
  # Containers: Postgres (both services) + Redis + Kafka + Zipkin (core-service)
  # ─────────────────────────────────────────────────────────────────────────────
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up GraalVM JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run integration tests (*IT)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Testcontainers reuse is disabled in CI to get a clean state each run
          TESTCONTAINERS_REUSE_ENABLE: "false"
        run: |
          ./gradlew test \
            --tests "*..*IT" \
            --continue \
            --no-daemon \
            -x checkstyleMain -x checkstyleTest

      - name: Publish integration test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "**/build/test-results/test/TEST-*.xml"
          check_name: "Integration Test Results"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Checkstyle lint
  # Configured in config/checkstyle/checkstyle.xml, version 10.17.0
  # isIgnoreFailures=true in Gradle, so we enforce failure here explicitly
  # ─────────────────────────────────────────────────────────────────────────────
  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up GraalVM JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Checkstyle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew checkstyleMain checkstyleTest \
            --no-daemon \
            -x test

      - name: Upload Checkstyle reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: checkstyle-reports
          path: "**/build/reports/checkstyle/"
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4 — Compile check (fast gate, no tests)
  # Verifies that the whole multi-module build compiles after dependency resolution
  # from GitHub Packages (com.lisovskyi.* custom starters)
  # ─────────────────────────────────────────────────────────────────────────────
  compile:
    name: Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up GraalVM JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Compile all modules
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew compileJava compileTestJava \
            --no-daemon \
            -x test -x checkstyleMain -x checkstyleTest
