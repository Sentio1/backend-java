}

.group-selector__count {

}

.group-selector--active {

}

.group-selector--active .group-selector__count {

}

.group-selector--disabled {

}

.accordion-header {
    cursor: pointer;
}

.container {

}

.stacktrace {

}

}

* {

}

html,
body {

}

body {

}

h2 {

}

h3 {

}

h4, h5, h6 {

}

h1 code {

}

ul, ol, dl {

}

    color: inherit;
    line-height: 1.8;
    font-size: 100%;
    padding: 0;
}

a code {
    color: #1BA8CB;
}

    background-color: #f7f7f8;
    border-radius: 4px;
    font-size: 1em;

}

}

code em, tt em {

}

code + .copy-button {

}

.java-exception {

.java-exception ul {
    margin: 0;

.java-exception code {

}

.java-exception-part-toggle {

    background: azure;
    color: #686868;
}

.problem-detail {
    color: #02303A;
    font-size: 14px;
    margin: 0;
    padding: 0;
}
