apiVersion: 1

# Кореневий notification policy tree. Маршрутизація за лейблом severity, який
# проставляють самі alert rules (rules.yaml) - не за сервісом, бо сервісів
# ставатиме більше, а severity-каналів лишиться два (critical/warning).
policies:
  - orgId: 1
    receiver: discord-warning
    group_by: ["alertname", "app"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: discord-critical
        object_matchers:
          - ["severity", "=", "critical"]
        group_wait: 10s
        group_interval: 2m
        repeat_interval: 1h
        continue: false

      - receiver: discord-warning
        object_matchers:
          - ["severity", "=", "warning"]
        repeat_interval: 4h
        continue: false
