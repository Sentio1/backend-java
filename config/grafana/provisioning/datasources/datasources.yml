apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        # Клікаєш на trace в Grafana → одразу бачиш логи цього ж запиту в Loki
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: false
        customQuery: false
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki

  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    jsonData:
      derivedFields:
        # Якщо в лозі є traceId — Grafana автоматично робить посилання на Tempo.
        # Поле зветься mdc_traceId, не traceId: JsonLayout (logback-spring.xml) пише
        # MDC-ключі з префіксом mdc_ (com.github.loki4j.logback.json.MdcJsonProvider,
        # FIELD_MDC_PREFIX) - перевірено емпірично, бо це недокументована поведінка.
        - name: TraceID
          matcherRegex: '"mdc_traceId":"(\w+)"'
          url: '$${__value.raw}'
          datasourceUid: tempo
