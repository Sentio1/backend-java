global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: core-service
    # bootRun запускається на хості, Prometheus — у Docker:
    # host.docker.internal дозволяє контейнеру дістатися до хоста.
    # context-path /api/v1 → actuator живе на /api/v1/actuator/prometheus
    static_configs:
      - targets: [ 'host.docker.internal:8081' ]
    metrics_path: /api/v1/actuator/prometheus

  - job_name: user-service
    static_configs:
      - targets: [ 'host.docker.internal:8080' ]
    metrics_path: /api/v1/actuator/prometheus
