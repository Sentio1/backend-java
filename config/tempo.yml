server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        # Spring Boot 4 (spring-boot-micrometer-tracing-opentelemetry) шле traces лише
        # через OTLP/HTTP (io.opentelemetry.exporter.otlp.http.trace.OtlpHttpSpanExporter) -
        # gRPC-екпортера в новому tracing-автоконфіг модулі немає. 4317 лишається для
        # сумісності з іншими можливими OTLP/gRPC клієнтами (напр. Go-сервіси пізніше).
        http:
          endpoint: 0.0.0.0:4318

# Tempo 3.0 прибрав окремі top-level ingester/compactor/traces_storage блоки
# (мажорна зміна архітектури - розподілена ingest/compaction модель через
# live_store/block_builder/backend_scheduler/backend_worker). Ми запускаємось
# з дефолтним -target=all (один контейнер, як і раніше) - Tempo сама тримає
# всі ці модулі в одному процесі з розумними дефолтами; явно задаємо лише
# retention, бо дефолт (1h) для block_retention занадто короткий.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 1h # для dev; у prod збільшити до 336h (2 тижні)

backend_worker:
  compaction:
    block_retention: 1h # має збігатися з backend_scheduler вище

overrides:
  defaults:
    metrics_generator:
      processors: [ service-graphs, span-metrics ]
