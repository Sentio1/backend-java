spring:
  application:
    name: core-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        default_schema: core

  data:
    redis:
      password: ${REDIS_PASSWORD:}

    web:
      pageable:
        max-page-size: 100

server:
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  jwt:
    # Той самий ключ, яким user-service підписує токени - core-service лише
    # перевіряє підпис (JwtService.extractAllClaims), сам ніколи не видає токени.
    private-key: ${JWT_PRIVATE_KEY}
    previous-private-key: ${JWT_PREVIOUS_PRIVATE_KEY}
    issuer: sentio-startup

  security:
    public-paths:
      - /actuator/health/**
