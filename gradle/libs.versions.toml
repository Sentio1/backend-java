[versions]
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"

flyway = "13.2.0"
postgresql = "42.7.13"

resilience4j = "2.4.0"

loki-logback = "1.5.2"

grpc = "1.76.0"
grpc-spring = "1.1.0.RELEASE"

spring-ai = "2.0.0"
spring-modulith = "2.1.1"
spring-cloud = "2025.1.3"

graalvm-native-buildtools = "1.1.12"

# Custom starters
lisovskyi-security = "1.0.0"
lisovskyi-jpa = "1.0.1"
lisovskyi-web-error = "1.0.0"

mapstruct = "1.6.3"
lombok = "1.18.48"
lombok-mapstruct-binding = "0.2.0"
caffeine = "3.2.4"
vavr = "0.11.0"

jackson-databind-nullable = "0.2.11"

aspectjweaver = "1.9.22.1"
junit = "6.0.0"

[libraries]

# =========================
# Spring Boot
# =========================

# Custom starters
lisovskyi-security = { group = "io.github.lisovskyi-arsenii", name = "lisovskyi-security-starter", version.ref = "lisovskyi-security" }
lisovskyi-web-error = { group = "io.github.lisovskyi-arsenii", name = "lisovskyi-web-error-starter", version.ref = "lisovskyi-web-error" }
lisovskyi-jpa = { group = "io.github.lisovskyi-arsenii", name = "lisovskyi-jpa-starter", version.ref = "lisovskyi-jpa" }

# Mapstruct
mapstruct-core = { group = "org.mapstruct", name = "mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { group = "org.mapstruct", name = "mapstruct-processor", version.ref = "mapstruct" }

# =========================
# Lombok
# =========================
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombok-mapstruct-binding" }

# Jackson
jackson-databind-nullable = { module = "org.openapitools:jackson-databind-nullable", version.ref = "jackson-databind-nullable" }

spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
aspectjweaver = { module = "org.aspectj:aspectjweaver", version.ref = "aspectjweaver" }
spring-boot-starter-cache = { module = "org.springframework.boot:spring-boot-starter-cache" }
spring-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }

spring-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-data-jdbc = { module = "org.springframework.boot:spring-boot-starter-data-jdbc" }
spring-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }

spring-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-oauth2-client" }
spring-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }

spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }

spring-cloud-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }

# Модулі API
spring-modulith-api = { module = "org.springframework.modulith:spring-modulith-api" }
spring-modulith-events-api = { module = "org.springframework.modulith:spring-modulith-events-api" }

# Обов'язково для runtime / GraalVM AOT hints
spring-modulith-runtime = { module = "org.springframework.modulith:spring-modulith-runtime" }

# Для тестів перевірки архітектури
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }

spring-graphql = { module = "org.springframework.boot:spring-boot-starter-graphql" }

spring-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }

spring-websocket = { module = "org.springframework.boot:spring-boot-starter-websocket" }

spring-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-data-mongodb = { module = "org.springframework.boot:spring-boot-starter-data-mongodb" }
spring-data-elasticsearch = { module = "org.springframework.boot:spring-boot-starter-data-elasticsearch" }

spring-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka" }

spring-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }

spring-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }

spring-data-commons = { module = "org.springframework.data:spring-data-commons" }

spring-devtools = { module = "org.springframework.boot:spring-boot-devtools" }

spring-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }

# Test-scoped starters (Spring Boot 4 splits these out from the main starter)
spring-actuator-test = { module = "org.springframework.boot:spring-boot-starter-actuator-test" }
spring-data-jdbc-test = { module = "org.springframework.boot:spring-boot-starter-data-jdbc-test" }
spring-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
spring-flyway-test = { module = "org.springframework.boot:spring-boot-starter-flyway-test" }
spring-jdbc-test = { module = "org.springframework.boot:spring-boot-starter-jdbc-test" }
spring-validation-test = { module = "org.springframework.boot:spring-boot-starter-validation-test" }
spring-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }

spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }


# =========================
# Database / Migration
# =========================

spring-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }

flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }

# Version intentionally left to the Spring Boot BOM (4.1.0 manages 12.4.0) - flyway-core
# and flyway-database-postgresql must stay on matching major versions, and the BOM already
# keeps them in sync. Pinning this independently (the old "flyway" version ref is 13.2.0)
# would desync it from flyway-core and break at runtime.
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }

postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

# =========================
# HTTP
# =========================

http-client = { module = "org.springframework.boot:spring-boot-starter-restclient" }


# =========================
# gRPC
# =========================

grpc-client = { module = "org.springframework.grpc:spring-grpc-spring-boot-starter" }


# =========================
# Observability
# =========================

micrometer-core = { module = "io.micrometer:micrometer-core" }
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }

# Tracing: Micrometer -> OpenTelemetry bridge + OTLP exporter (версії керуються Spring Boot BOM)
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }

# Logs -> Loki
loki-logback = { module = "com.github.loki4j:loki-logback-appender", version.ref = "loki-logback" }

zipkin-reporter = { module = "io.zipkin.reporter2:zipkin-reporter-brave" }


# =========================
# REST Docs
# =========================

spring-restdocs = { module = "org.springframework.restdocs:spring-restdocs-mockmvc" }


# =========================
# Resilience4j
# =========================

resilience4j-spring-boot = { module = "io.github.resilience4j:resilience4j-spring-boot4", version.ref = "resilience4j" }

resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker", version.ref = "resilience4j" }

resilience4j-retry = { module = "io.github.resilience4j:resilience4j-retry", version.ref = "resilience4j" }

resilience4j-ratelimiter = { module = "io.github.resilience4j:resilience4j-ratelimiter", version.ref = "resilience4j" }


# =========================
# AI
# =========================

spring-ai-anthropic = { module = "org.springframework.ai:spring-ai-starter-model-anthropic", version.ref = "spring-ai" }
spring-ai-google-genai = { module = "org.springframework.ai:spring-ai-starter-model-google-genai", version.ref = "spring-ai" }

# =========================
# Caching
# =========================

caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }

# =========================
# Functional Programming
# =========================
vavr = { module = "io.vavr:vavr", version.ref = "vavr"}

# =========================
# Testing
# =========================

spring-test = { module = "org.springframework.boot:spring-boot-starter-test" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

testcontainers = { module = "org.testcontainers:testcontainers" }

# NOTE: fixed from "org.testcontainers:junit-jupiter" / "org.testcontainers:postgresql" -
# those coordinates don't resolve against testcontainers 2.x, which renamed these modules
# with a "testcontainers-" prefix.
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }

testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }

testcontainers-mongodb = { module = "org.testcontainers:testcontainers-mongodb" }

testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka" }


[plugins]

spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }

spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }

graalvm-native-buildtools = { id = "org.graalvm.buildtools.native", version.ref = "graalvm-native-buildtools" }

[bundles]
annotation-processors = [
    "lombok",
    "lombok-mapstruct-binding",
    "mapstruct-processor",
    "spring-configuration-processor"
]

test-annotation-processors = [
    "lombok",
    "mapstruct-processor"
]