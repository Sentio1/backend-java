services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_container

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    restart: unless-stopped

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    volumes:
      - postgres_data:/var/lib/postgresql/data/

  redis:
    image: redis:8-alpine
    container_name: redis_container
    ports:
      # Loopback-only: only this host's own processes (the app run via bootRun)
      # need to reach it - nothing outside the host should be able to.
      - "127.0.0.1:6379:6379"
    # No fallback default - an unset REDIS_PASSWORD must fail `docker compose up`
    # loudly instead of quietly starting Redis with a well-known password.
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    restart: unless-stopped
    volumes:
      - ./redis_data:/data

volumes:
  postgres_data:
  redis_data: