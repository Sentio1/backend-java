spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:user-service/.env[.properties]

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_USER_SERVICE_DB}
    username: postgres
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true
    # V6__make_users_email_unique.sql mixes a CREATE INDEX CONCURRENTLY (can't run in
    # a transaction) with a regular ALTER TABLE - Flyway refuses that combination
    # unless this is set.
    mixed: true

logging:
  level:
    com.sentio.*: DEBUG