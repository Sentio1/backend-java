spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:user-service/.env[.properties]

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true


logging:
  level:
    root: WARN