spring:
  application:
    name: user-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  threads:
    virtual:
      enabled: true

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        default_schema: auth
    open-in-view: false

  modulith:
    events:
      # Default (update) keeps completed rows forever - serialized_event is a JSON dump of the
      # whole event, including the raw verification/reset token, sitting in plaintext in the DB
      # indefinitely. delete removes the row right after a successful delivery (window shrinks
      # back to roughly what the old in-memory registry had); incomplete/failed publications are
      # untouched until they succeed, so the republish-after-crash guarantee is unaffected.
      completion-mode: delete
      jdbc:
        # Table lives in auth (V12) alongside everything else - schema-initialization
        # stays disabled (the default), Flyway owns it like every other table here.
        schema: auth

  data:
    redis:
      password: ${REDIS_PASSWORD:}

    web:
      pageable:
        max-page-size: 100

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
              - openid

  lifecycle:
    timeout-per-shutdown-phase: 30s

  session:
    # Spring Session in Redis - the OAuth2 handshake can finish on any replica.
    redis:
      namespace: user-service:session

server:
  shutdown: graceful
  servlet:
    context-path: /api/v1
    session:
      # Only the Google OAuth2 handshake uses a session (authorization request
      # between /oauth2/authorization/google and the callback) - a few minutes is plenty.
      timeout: 10m

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  # Spring Boot 4: spring-boot-micrometer-tracing-opentelemetry шле лише через
  # OTLP/HTTP (OtlpHttpSpanExporter, немає gRPC-варіанта) - тому 4318, не 4317,
  # і обов'язковий /v1/traces (сам Spring Boot суфікс не додає, на відміну від
  # generic OTEL_EXPORTER_OTLP_ENDPOINT).
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

loki:
  url: ${LOKI_URL:http://localhost:3100/loki/api/v1/push}


app:
  jwt:
    private-key: ${JWT_PRIVATE_KEY:}
    previous-private-key: ${JWT_PREVIOUS_PRIVATE_KEY:}
    issuer: sentio-startup
    # 7 days, sliding: every refresh issues a token valid for another 7 days...
    refresh-token-expiration: 604800000

  session:
    # ...but a session (refresh token family) never outlives this from the login.
    absolute-lifetime: 30d

  rate-limit:
    rules:
      login-by-email: { limit: 5, window: 60s }
      login-by-ip: { limit: 20, window: 60s }
      register-by-email: { limit: 5, window: 60s }
      register-by-ip: { limit: 20, window: 60s }
      service-token-by-email: { limit: 5, window: 60s }
      service-token-by-ip: { limit: 20, window: 60s }
      refresh-by-ip: { limit: 60, window: 60s }
      verify-email-by-ip: { limit: 20, window: 60s }
      # by-ip is only a second layer (shared office/NAT would otherwise starve everyone
      # behind it) - by-user is the actual anti-spam control against resending to yourself.
      resend-verification-by-ip: { limit: 20, window: 60s }
      resend-verification-by-user: { limit: 3, window: 600s }
      password-reset-by-ip: { limit: 20, window: 60s }
      password-reset-by-email: { limit: 5, window: 60s }
      password-reset-confirm-by-ip: { limit: 20, window: 60s }

  security:
    allow-credentials: true
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
    bcrypt-strength: 12
    public-paths:
      - /auth/register
      - /auth/login
      - /auth/refresh
      - /email-verification/confirm
      - /password-reset/request
      - /password-reset/confirm
      - /oauth2/**
      - /login/oauth2/**
      - /actuator/health/**

  cookie:
    # Starter default is true; only application-dev.yaml turns it off (plain http localhost).
    secure: true
    # /auth, not the starter's /auth/refresh: logout has to receive the refresh cookie
    # too, or it can never revoke the session server-side.
    refresh-token-path: /auth
    # Must match app.jwt.refresh-token-expiration (seconds here, millis there).
    refresh-token-max-age: 604800
    same-site: Lax

  email-verification:
    token-ttl: 24h
    # Frontend page that receives the token (?token=...) and POSTs it to /email-verification/confirm.
    verification-url: http://localhost:5173/verify-email

  password-reset:
    # Shorter than email-verification's 24h on purpose - a sensitive action deserves a
    # small attack window.
    token-ttl: 30m
    # Frontend page that receives the token (?token=...) and POSTs it + the new password to /password-reset/confirm.
    reset-url: http://localhost:5173/reset-password

  oauth:
    success-redirect-uri: http://localhost:5173/dashboard
    failure-redirect-uri: http://localhost:5173/login