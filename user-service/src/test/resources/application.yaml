spring:
  autoconfigure:
    exclude:
      # No Redis Testcontainer/instance available for this test suite, and none
      # of these tests care about the blacklist's storage backend. Without this,
      # lisovskyi-security-starter 0.3.4+ correctly picks DataRedisAutoConfiguration's
      # StringRedisTemplate over InMemoryJwtBlacklistService (see SecurityAutoConfiguration's
      # @AutoConfigureAfter fix) and every request touching JwtAuthFilter fails with
      # RedisConnectionFailureException trying to reach a Redis that isn't there.
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret

resilience4j:
  ratelimiter:
    configs:
      login-by-email:
        limit-for-period: 5
        limit-refresh-period: 60s
        timeout-duration: 0s

      login-by-ip:
        limit-for-period: 20
        limit-refresh-period: 60s
        timeout-duration: 0s

      register-by-email:
        limit-for-period: 5
        limit-refresh-period: 60s
        timeout-duration: 0s

      register-by-ip:
        limit-for-period: 20
        limit-refresh-period: 60s
        timeout-duration: 0s

app:
  jwt:
    # Test-only RSA private key (PKCS8 DER, base64) - never the real Doppler key.
    private-key: 
    # Second test-only RSA private key, distinct from the one above - lets
    # JwksControllerIT actually exercise the documented two-key rotation response
    # (both keys' public halves must show up in JWKS at once) instead of leaving
    # this config permanently unverified. Also never the real Doppler key.
    previous-private-key: 
    issuer: sentio-startup-test

  oauth:
    success-redirect-uri: http://localhost:5173/dashboard
    failure-redirect-uri: http://localhost:5173/login
