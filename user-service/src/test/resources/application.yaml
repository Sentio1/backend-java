spring:
  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret

resilience4j:
  ratelimiter:
    configs:
      login-by-email:
        limit-for-period: 5
        limit-refresh-period:
          seconds: 60
        timeout-duration:
          seconds: 0

      login-by-ip:
        limit-for-period: 20
        limit-refresh-period:
          seconds: 60
        timeout-duration:
          seconds: 0

      register-by-email:
        limit-for-period: 5
        limit-refresh-period:
          seconds: 60
        timeout-duration:
          seconds: 0

      register-by-ip:
        limit-for-period: 20
        limit-refresh-period:
          seconds: 60
        timeout-duration:
          seconds: 0

app:
  jwt:
    # Test-only RSA private key (PKCS8 DER, base64) - never the real Doppler key.
    private-key: 
    previous-private-key:
    issuer: sentio-startup-test

  oauth:
    success-redirect-uri: http://localhost:5173/dashboard
    failure-redirect-uri: http://localhost:5173/login
