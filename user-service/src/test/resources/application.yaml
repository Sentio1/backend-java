spring:
  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate

resilience4j:
  ratelimiter:
    configs:
      login-by-email:
        limit-for-period: 5
        limit-refresh-period:
          seconds: 60
        timeout-duration:
          seconds: 0

      login-by-ip:
        limit-for-period: 20
        limit-refresh-period:
          seconds: 60
        timeout-duration:
          seconds: 0

      register-by-email:
        limit-for-period: 5
        limit-refresh-period:
          seconds: 60
        timeout-duration:
          seconds: 0

      register-by-ip:
        limit-for-period: 20
        limit-refresh-period:
          seconds: 60
        timeout-duration:
          seconds: 0

app:
  jwt:
    signing-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970 # Dummy base64 key for tests
    issuer: sentio-startup-test